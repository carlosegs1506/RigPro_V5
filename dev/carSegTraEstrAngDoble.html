<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Carga Segura Estrobo Angulada Doble</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="../assest/img/logo1.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assest/css/style.css" />
  </head>

  <body>
    <ul class="ul_principal_segundario">
      <li>
        <button class="button_principal_segundario">
          <a href="../dev/segundario.html">Regresar</a>
        </button>
        <img class="imagen" src="../assest/img/logo1.png" />
      </li>
    </ul>

    <div class="container_todos">
      <h2>CAPACIDAD ESTROBOS SEGUN SU DIAMETRO</h2>
      <div class="inputs">
        <label for="capacidad"
          >Diámetro del Cable<span class="descripcion"
            ><br />En pulgadas (ej: 7/8, 1 1/2, 2)</span
          ></label
        >
        <input
          type="text"
          id="capacidad"
          step="any"
          name="capacidad"
          placeholder="Ingresa pulgadas + fraccion"
          required
        />
        <div id="capacidadError" class="error-message"></div>
        <label for="amarre">Tipo de Estrobado</label>
        <select id="amarre">
          <option value="axial">Axial</option>
          <option value="lazo">Lazo</option>
          <option value="canasta">Canasta</option>
        </select>
      </div>
      <button class="enviar" onclick="calcularCapacidad()">
        <span class="span">Calcular</span>
      </button>
      <div class="result">
        <p>
          Capacidad:
          <span id="resultado"></span>
        </p>
      </div>
    </div>

    <div class="container_todos">
      <h2>CARGA SEGURA ESTROBOS CANASTA ANGULADA DOBLE</h2>
      <div class="inputs">
        <form id="estrobos-form">
          <label for="doble"
            >Capacidad Axial<span class="descripcion"
              ><br />WLL vertical de UN estrobo (Kg)</span
            ></label
          >
          <input
            type="number"
            id="doble"
            step="any"
            name="capacidad"
            placeholder="Ingresa capacidad en Kg"
            required
          />
          <div id="dobleError" class="error-message"></div>

          <label for="altura"
            >Altura<span class="descripcion"
              ><br />Distancia vertical desde el gancho hasta la carga</span
            ></label
          >
          <input
            type="number"
            id="altura"
            step="any"
            name="altura"
            placeholder="Ingresa altura"
            required
          />
          <div id="alturaError" class="error-message"></div>

          <label for="largo"
            >Largo<span class="descripcion"
              ><br />Largo real del estrobo, de punta a punta</span
            ></label
          >
          <input
            type="number"
            id="largo"
            step="any"
            name="largo"
            placeholder="Ingresa Largo"
            required
          />
          <div id="largoError" class="error-message"></div>
        </form>
      </div>
      <button class="enviar" onclick="capacidadSeguraVerticalAnguladaDoble()">
        <span class="span">Calcular</span>
      </button>
      <div class="result">
        <p>
          Carga segura:
          <span id="capacidadSeguraEstroboAnguladaDoble"></span>
        </p>
      </div>
    </div>

    <div id="procesoDoble" class="proceso"></div>

    <script src="../assest/js/capEstrobos.js"></script>
    <script src="../assest/js/carSegTraEstrAngDoble.js"></script>
  </body>
</html>
