<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Centro de Gravedad Compuesto</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="../assest/img/gancho_modificado.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assest/css/style.css" />
  </head>

  <body>
    <ul class="ul_principal_segundario">
      <li>
        <button class="button_principal_segundario">
          <a href="../dev/segundario.html">Regresar</a>
        </button>
        <img class="imagen" src="../assest/img/gancho_modificado.png" />
      </li>
    </ul>

    <div class="container_todos">
      <h2>CENTRO DE GRAVEDAD COMPUESTO</h2>
      <p class="nota-ayuda">
        Elige UN punto fijo de referencia (ej: el extremo izquierdo de todo
        el conjunto) y mide las 3 distancias desde ese mismo punto hasta el
        centro de cada peso. Si usas puntos de referencia distintos para
        cada distancia, el resultado no será correcto.
      </p>
      <div class="inputs">
        <label for="cantidadPiezas">Cantidad de Piezas</label>
        <select id="cantidadPiezas">
          <option value="2">2 piezas</option>
          <option value="3">3 piezas</option>
        </select>

        <label for="peso1">Peso 1</label>
        <input
          type="number"
          id="peso1"
          name="peso"
          placeholder="Ingresa peso 1"
          required
        />
        <div id="peso1Error" class="error-message"></div>

        <label for="distancia1"
          >Distancia 1 (mts)<br /><span class="descripcion"
            >Desde el punto de referencia elegido hasta el centro del Peso
            1</span
          ></label
        >
        <input
          type="number"
          id="distancia1"
          name="distancia1"
          placeholder="Ingresa distancia 1"
          required
        />
        <div id="distancia1Error" class="error-message"></div>

        <label for="peso2">Peso 2</label>
        <input
          type="number"
          id="peso2"
          name="peso2"
          placeholder="Ingresa peso 2"
          required
        />
        <div id="peso2Error" class="error-message"></div>

        <label for="distancia2"
          >Distancia 2 (mts)<br /><span class="descripcion"
            >Desde el MISMO punto de referencia, hasta el centro del Peso
            2</span
          ></label
        >
        <input
          type="number"
          id="distancia2"
          name="distancia2"
          placeholder="Ingresa distancia 2"
          required
        />
        <div id="distancia2Error" class="error-message"></div>

        <div id="campoPieza3">
          <label for="peso3">Peso 3</label>
          <input
            type="number"
            id="peso3"
            name="peso3"
            placeholder="Ingresa peso 3"
          />
          <div id="peso3Error" class="error-message"></div>

          <label for="distancia3"
            >Distancia 3 (mts)<br /><span class="descripcion"
              >Desde el MISMO punto de referencia, hasta el centro del Peso
              3</span
            ></label
          >
          <input
            type="number"
            id="distancia3"
            name="distancia3"
            placeholder="Ingresa distancia 3"
          />
          <div id="distancia3Error" class="error-message"></div>
        </div>
      </div>
      <button class="enviar" onclick="centroGravedadCompuesto()">
        <span class="span">Calcular</span>
      </button>
      <div class="result">
        <p>
          Centro de Gravedad:
          <span id="centroGravedad"></span>
        </p>
      </div>
    </div>

    <div id="procesoCompuesto" class="proceso"></div>
    <div id="imagenProceso" class="imagen-proceso" style="display: none">
      <img
        src="../assest/img/centro de gravedad compuesto.png"
        alt="imagen altura de trabajo"
      />
    </div>

    <script src="../assest/js/centroGravedadCompuesto.js"></script>
  </body>
</html>
