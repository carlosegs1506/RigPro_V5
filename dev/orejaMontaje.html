<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Oreja Montaje</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="../assest/img/logo1.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assest/css/style.css" />
  </head>

  <body>
    <ul class="ul_principal_segundario">
      <li>
        <button class="button_principal_segundario">
          <a href="../dev/segundario.html">Regresar</a>
        </button>
        <img class="imagen" src="../assest/img/logo1.png" />
      </li>
    </ul>

    <div class="container_todos">
      <h2>OREJA DE MONTAJE</h2>
      <div class="inputs">
        <form>
          <label for="gramil"
            >Gramil<span class="descripcion"
              ><br />Distancia desde el borde de la placa hasta el centro
              de la perforación (mm)</span
            ></label
          >
          <input
            type="number"
            id="gramil"
            step="any"
            name="gramil"
            placeholder="Ingresa gramil en mm"
            required
          />
          <div id="gramilError" class="error-message"></div>

          <label for="espesor">Espesor (mm)</label>
          <input
            type="number"
            id="espesor"
            step="any"
            name="espesor"
            placeholder="Ingresa espesor en mm"
            required
          />
          <div id="espesorError" class="error-message"></div>
        </form>
      </div>

      <button class="enviar" onclick="capacidadOrejaMontaje()">
        <span class="span">Calcular</span>
      </button>
      <div class="result">
        <p>
          Capacidad:
          <span id="capacidadOreja"></span>
        </p>
      </div>
    </div>

    <div id="procesoDesarrollo" class="proceso"></div>
    <div id="imagenProceso" class="imagen-proceso" style="display: none">
      <img
        src="../assest/img/oreja de montaje.png"
        alt="imagen oreja de montaje"
      />
    </div>

    <script src="../assest/js/orejaMontaje.js"></script>
  </body>
</html>
