<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Ticket Diario de Izaje</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="../assest/img/logo1.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assest/css/style.css" />
    <style>
      #ticketRoot { max-width: 480px; margin: 0 auto; }
      .tk-panel {
        background-color: #050503; border: 3px solid var(--steel); border-radius: 10px;
        padding: 20px; margin: 15px auto; width: 95%; color: #fff;
      }
      .tk-panel label { display: block; margin: 12px 0 4px 0; font-size: 0.95em; }
      .tk-panel input, .tk-panel textarea {
        width: 100%; padding: 10px; border-radius: 6px; border: 2px solid var(--steel);
        background-color: #111; color: #fff; font-size: 1em; box-sizing: border-box; font-family: inherit;
      }
      .tk-panel textarea { min-height: 70px; resize: vertical; }
      .tk-boton {
        display: block; width: 95%; margin: 15px auto; padding: 16px;
        background-color: var(--secondary); color: var(--secondary-ink); border: none;
        border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; text-align: center;
      }
      .tk-boton-secundario {
        display: block; width: 95%; margin: 8px auto; padding: 10px; background-color: transparent;
        color: #ff6b6b; border: 2px solid #ff6b6b; border-radius: 8px; font-size: 0.95em;
        cursor: pointer; text-align: center; display: none;
      }
      #tkLista { width: 95%; margin: 15px auto; }
      .tk-tarjeta {
        background-color: #111; border: 2px solid var(--steel); border-radius: 10px;
        padding: 14px 16px; margin-bottom: 12px; color: #fff;
      }
      .tk-tarjeta-titulo { font-weight: bold; font-size: 1.05em; display: flex; justify-content: space-between; }
      .tk-tarjeta-detalle { font-size: 0.88em; margin-top: 6px; line-height: 1.5; }
      .tk-btn-borrar {
        background: transparent; border: 1px solid #c62828; color: #c62828;
        border-radius: 6px; padding: 4px 10px; font-size: 0.85em; cursor: pointer;
      }
      .tk-vacio { color: #fff; text-align: center; margin: 20px 0; }
    </style>
  </head>
  <body>
    <ul class="ul_principal_segundario">
      <li>
        <button class="button_principal_segundario"><a href="./index_es.html">Regresar</a></button>
        <img class="imagen" src="../assest/img/logo1.png" />
      </li>
    </ul>

    <div id="ticketRoot">
      <div class="container_todos">
        <h2 style="text-align:center;">TICKET DIARIO DE IZAJE</h2>

        <div class="tk-panel">
          <label for="tkFecha">Fecha</label>
          <input type="date" id="tkFecha" />

          <label for="tkProyecto">Proyecto / cliente / ubicación</label>
          <input type="text" id="tkProyecto" placeholder="Ej: Faena Norte, Cía Minera X" />

          <label for="tkResponsable">Responsable / rigger a cargo</label>
          <input type="text" id="tkResponsable" placeholder="Ej: Carlos Sepúlveda" />

          <label for="tkGrua">Grúa / equipo utilizado</label>
          <input type="text" id="tkGrua" placeholder="Ej: Liebherr LTM 1100-4.2" />

          <label for="tkPeso">Peso de la carga (kg)</label>
          <input type="number" id="tkPeso" placeholder="Ej: 7200" min="0" />

          <label for="tkDescripcion">Descripción breve de la maniobra</label>
          <textarea id="tkDescripcion" placeholder="Ej: izaje de estanque hacia plataforma nivel 2"></textarea>

          <label for="tkNotas">Notas / observaciones (opcional)</label>
          <textarea id="tkNotas" placeholder="Ej: viento moderado, se usó eslinga de 4 puntos"></textarea>
        </div>

        <button class="tk-boton" id="tkBtnAgregar">Guardar ticket</button>

        <h3 style="color:#fff; text-align:center; margin-top:20px;">Tickets guardados</h3>
        <div id="tkLista"></div>
        <button class="tk-boton-secundario" id="tkBtnBorrarTodo">Borrar todos los tickets</button>
      </div>
    </div>

    <script src="../assest/js/ticketIzaje.js"></script>
  </body>
</html>
