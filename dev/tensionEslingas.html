<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Tension de Eslingas</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../assest/img/logo1.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assest/css/style.css" />
  </head>
  <body>
    <ul class="ul_principal_segundario">
      <li>
        <button class="button_principal_segundario">
          <a href="../dev/principal.html">Regresar</a>
        </button>
        <img class="imagen" src="../assest/img/logo1.png" />
      </li>
    </ul>

    <div class="container_todos">
      <h2>ANGULO DE TRABAJO</h2>
      <p class="nota-ayuda">
        Calcula el ángulo de la eslinga a partir de dos medidas fáciles de
        tomar en terreno. Después usa ese resultado en el campo "Ángulo" de
        abajo.
      </p>
      <div class="inputs">
        <label for="radio"
          >Radio<span class="descripcion"
            ><br />Distancia horizontal desde el punto de enganche hasta el
            centro de la carga</span
          ></label
        >
        <input
          type="number"
          id="radio"
          step="any"
          placeholder="Ingresa radio"
          name="radio"
          required
        />
        <div id="radioError" class="error-message"></div>

        <label for="largo"
          >Largo<span class="descripcion"
            ><br />Largo real de la eslinga, de punta a punta</span
          ></label
        >
        <input
          type="number"
          id="largo"
          step="any"
          placeholder="Ingresa largo"
          name="largo"
          required
        />
        <div id="largoError" class="error-message"></div>
      </div>
      <button class="enviar" onclick="calcularAngulo()">
        <span class="span">Calcular</span>
      </button>
      <div class="result">
        <p>Angulo: <span id="resultado"></span></p>
      </div>
    </div>

    <div class="container_todos">
      <h2>TENSION DE ESLINGAS</h2>
      <div class="inputs">
        <label for="peso">Peso</label>
        <input
          type="number"
          id="peso"
          step="any"
          name="peso"
          placeholder="Ingresa peso en Kg"
          required
        />
        <div id="pesoError" class="error-message"></div>

        <label for="numero">Número de Eslingas</label>
        <input
          type="number"
          id="numero"
          step="any"
          name="numero"
          placeholder="Ingresa número de eslingas"
          required
        />
        <div id="numeroError" class="error-message"></div>

        <label for="angulo"
          >Ángulo<span class="descripcion"
            ><br />Medido desde la horizontal de la carga (90° = eslinga
            vertical)</span
          ></label
        >
        <input
          type="number"
          id="angulo"
          step="any"
          name="angulo"
          placeholder="Ingresa ángulo en grados"
          required
        />
        <div id="anguloError" class="error-message"></div>
      </div>
      <button class="enviar" onclick="calcularTensionEslingas()">
        <span class="span">Calcular</span>
      </button>
      <div class="result">
        <p>Tensión: <span id="tensionEslingas"></span></p>
      </div>
    </div>

    <div id="proceso" class="proceso"></div>
    <div id="imagenProceso" class="imagen-proceso" style="display: none">
      <img
        src="../assest/img/tension de eslingas.png"
        alt="imagen altura de trabajo"
      />
    </div>

    <script src="../assest/js/tensionEslingas.js"></script>
  </body>
</html>
