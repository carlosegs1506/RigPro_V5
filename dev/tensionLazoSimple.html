<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Tensión Lazo Simple</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../assest/img/gancho_modificado.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assest/css/style.css" />
  </head>

  <body>
    <ul class="ul_principal_segundario">
      <li>
        <button class="button_principal_segundario">
          <a href="../dev/principal.html">Regresar</a>
        </button>
        <img class="imagen" src="../assest/img/gancho_modificado.png" />
      </li>
    </ul>

    <div class="container_todos">

      <h2>TENSIÓN LAZO SIMPLE</h2>

      <div class="inputs">
        <label for="peso">Peso de la Carga</label>

        <input
          type="number"
          id="peso"
          step="any"
          placeholder="Ingresa el peso en Kg"
          required
        />

        <div id="pesoError" class="error-message"></div>

      </div>

      <div class="inputs">

        <label for="angulo"
          >Ángulo<span class="descripcion"
            ><br />Medido desde la horizontal de la carga (90° = eslinga
            vertical)</span
          ></label
        >

        <input
          type="number"
          id="angulo"
          step="any"
          placeholder="Ingresa ángulo en grados"
          required
        />

        <div id="anguloError" class="error-message"></div>

      </div>

      <button class="enviar" onclick="calcularTensionLazoSimple()">
        <span class="span">Calcular</span>
      </button>

      <div class="result">
        <p>

          Tensión:

          <span id="tensionLazo"></span>

        </p>
      </div>

    </div>

    <div id="procesoSimple" class="proceso"></div>

    <div id="imagenProceso" class="imagen-proceso" style="display:none">

      <img
      src="../assest/img/lazo simple 1.png"
      alt="Tensión lazo simple">

    </div>

    <script src="../assest/js/tensionLazoSimple.js"></script>

  </body>

</html>
